<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIAS: HIP-HOP EDITION - Игра</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function HiphopAliasGame() {
            const movements = [
                { name: 'Criss Cross', desc: 'Крис-кросс: ноги перекрещиваются в прыжке' },
                { name: 'Running Man', desc: 'Ранин мен: бег на месте с высокими коленями' },
                { name: 'Happy Feet', desc: 'Хэппи фит: быстрые лёгкие движения ступнями' },
                { name: 'V-Step', desc: 'V-шаг: ноги разводятся в форме буквы V' },
                { name: 'Party Machine', desc: 'Пати машина: энергичное ритмичное движение' },
                { name: 'Monastery', desc: 'Монастери: движение с изоляцией верхней части тела' },
                { name: 'SpongeBob', desc: 'Спанч Боб: движение как персонаж из мультфильма' },
                { name: 'BK Bounce', desc: 'БК баунс: качание с отскоками' },
                { name: 'Walk It Out', desc: 'Волк аут: уверенный шаг вперёд' },
                { name: 'The Wop', desc: 'Воп: резкие движения головой и руками' },
                { name: 'Party Duke', desc: 'Пати дюк: движение из 80х' },
                { name: 'Kick Out', desc: 'Кик аут: выпад ноги в сторону' },
                { name: 'March Step', desc: 'Марш степ: как воинский марш' },
                { name: 'Horse Move', desc: 'Хорс мув: движение как лошадь' },
                { name: 'Wu Tang', desc: 'Ву танг: боевые искусства' },
                { name: 'Reject', desc: 'Реджект: отрывистое движение' },
                { name: 'Roger Rabbit', desc: 'Кролик Роджер: быстрые прыжки' },
                { name: 'Atl Stomp', desc: 'Атланта стамп: топающее движение' },
                { name: 'Indian Step', desc: 'Индиан степ: элементы индейского танца' },
                { name: 'Z-Step', desc: 'Зет-шаг: движение в форме Z' },
                { name: 'ShamRock', desc: 'Шем рок: быстрое качающееся движение' },
                { name: 'Al B', desc: 'Ал би: плавное и ритмичное движение' },
                { name: 'Back Jump', desc: 'Бэк джамп: прыжок назад' },
                { name: 'Kick', desc: 'Кик: удар ногой' },
                { name: 'Back Jump + Kick', desc: 'Бэк джамп + кик: комбинация' },
                { name: 'Heel Toe', desc: 'Хил тоу: пятка-носок' },
                { name: 'Reebok', desc: 'Рибок: скользящие движения' },
                { name: 'Dougie', desc: 'Доги: качание бёдер' },
                { name: 'Biz Markie', desc: 'Биз марки: уникальное движение' },
                { name: 'Town Wop', desc: 'Таун воп: городской воп' },
                { name: 'The Charleston', desc: 'Чарлестон: танец 20х годов' },
                { name: 'Cabbage Patch', desc: 'Кэббэтч патч: как срываешь капусту' },
                { name: 'Erk & Jerk', desc: 'Эрк энд джёрк: дёргающие движения' },
                { name: 'C-Walk', desc: 'Си-волк: характерный зигзаг' },
                { name: 'Roof Top', desc: 'Руф топ: прыгающее движение' },
                { name: 'Steve Martin', desc: 'Стив Мартин: комедийное' },
                { name: 'Bart Simpson', desc: 'Барт Симпсон: наклон в сторону' },
                { name: 'Crab', desc: 'Краб: движение как краб' },
                { name: 'Crazy Legs', desc: 'Крейзи легс: быстрые движения ног' },
                { name: 'Step and Touch', desc: 'Степ энд тач: шаг с касанием' },
                { name: 'Cat Daddy', desc: 'Кэт дэдди: грациозное как кот' },
                { name: 'Prep', desc: 'Преп: стильное движение' },
                { name: 'James Brown', desc: 'Джеймс Браун: энергичное' },
                { name: 'Salsa Step', desc: 'Сальса степ: латинские элементы' },
                { name: 'Jack in the Box', desc: 'Джек ин зе бокс: прыгающее' },
                { name: 'Party Dance', desc: 'Пати денс: вечериночный танец' },
                { name: 'Janet Jackson', desc: 'Джанет Джексон: сексуальное' },
                { name: 'Around the World', desc: 'Эраунд ворлд: круговое' },
                { name: 'Kick and Slide', desc: 'Кик энд слайд: удар и скольжение' },
                { name: 'Harlem Shake', desc: 'Гарлем шейк: трясение' },
                { name: 'TLC', desc: 'ТИ ЭЛ СИ: вдохновлено группой' },
                { name: 'Popcorn', desc: 'Попкорн: прыгающие движения' },
                { name: 'Smurf', desc: 'Смёрф: быстрые движения' },
                { name: 'Robocop', desc: 'Робокоп: механичные движения' },
                { name: 'PA DE BU RE', desc: 'Па де бу ре: классическое движение' },
            ];

            const [currentScreen, setCurrentScreen] = useState('menu');
            const [gameMode, setGameMode] = useState(null);
            const [team1Name, setTeam1Name] = useState('');
            const [team2Name, setTeam2Name] = useState('');
            const [showTeamSetup, setShowTeamSetup] = useState(false);
            const [currentRound, setCurrentRound] = useState(1);
            const [currentTeam, setCurrentTeam] = useState(1);
            const [team1Score, setTeam1Score] = useState(0);
            const [team2Score, setTeam2Score] = useState(0);
            const [roundScore, setRoundScore] = useState(0);
            const [currentWord, setCurrentWord] = useState('');
            const [timeLeft, setTimeLeft] = useState(30);
            const [usedWords, setUsedWords] = useState(new Set());
            const [showWord, setShowWord] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            const getRandomWord = () => {
                let word;
                do {
                    word = movements[Math.floor(Math.random() * movements.length)].name;
                } while (usedWords.has(word));
                return word;
            };

            const startTeamsGame = () => {
                if (team1Name.trim() && team2Name.trim()) {
                    setCurrentScreen('playing');
                    setShowTeamSetup(false);
                    setCurrentRound(1);
                    setCurrentTeam(1);
                    setTeam1Score(0);
                    setTeam2Score(0);
                    setRoundScore(0);
                    setUsedWords(new Set());
                    const word = getRandomWord();
                    setCurrentWord(word);
                    setUsedWords(prev => new Set(prev).add(word));
                    setTimeLeft(30);
                    setShowWord(false);
                }
            };

            useEffect(() => {
                if (currentScreen !== 'playing') return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            finishRound();
                            return 30;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [currentScreen, currentTeam]);

            const guessedCorrect = () => {
                setRoundScore(roundScore + 1);
                if (usedWords.size < movements.length) {
                    const word = getRandomWord();
                    setCurrentWord(word);
                    setUsedWords(prev => new Set(prev).add(word));
                    setShowWord(false);
                }
            };

            const skipWord = () => {
                if (usedWords.size < movements.length) {
                    const word = getRandomWord();
                    setCurrentWord(word);
                    setUsedWords(prev => new Set(prev).add(word));
                    setShowWord(false);
                }
            };

            const finishRound = () => {
                if (currentTeam === 1) {
                    setTeam1Score(team1Score + roundScore);
                } else {
                    setTeam2Score(team2Score + roundScore);
                }
                if (currentRound < 4) {
                    setCurrentRound(currentRound + 1);
                    setCurrentTeam(currentTeam === 1 ? 2 : 1);
                    setRoundScore(0);
                    setUsedWords(new Set());
                    const word = getRandomWord();
                    setCurrentWord(word);
                    setUsedWords(prev => new Set(prev).add(word));
                    setTimeLeft(30);
                    setShowWord(false);
                } else {
                    setCurrentScreen('final');
                }
            };

            const resetGame = () => {
                setCurrentScreen('menu');
                setTeam1Name('');
                setTeam2Name('');
                setShowTeamSetup(false);
                setCurrentRound(1);
                setCurrentTeam(1);
                setTeam1Score(0);
                setTeam2Score(0);
                setRoundScore(0);
                setTimeLeft(30);
                setUsedWords(new Set());
                setShowWord(false);
                setSearchQuery('');
            };

            const filteredMovements = movements.filter(m =>
                m.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="min-h-screen bg-gradient-to-b from-gray-900 via-gray-800 to-black text-white font-sans">
                    <div className="fixed inset-0 opacity-10 pointer-events-none">
                        <div className="absolute top-0 left-0 w-96 h-96 bg-yellow-400 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-0 right-0 w-96 h-96 bg-red-600 rounded-full blur-3xl"></div>
                    </div>

                    <div className="relative z-10 min-h-screen flex flex-col items-center justify-center p-4">
                        
                        {currentScreen === 'menu' && (
                            <div className="text-center space-y-8 max-w-2xl">
                                <div>
                                    <h1 className="text-7xl font-black mb-2 bg-gradient-to-r from-yellow-300 via-red-500 to-pink-600 bg-clip-text text-transparent">
                                        ALIAS
                                    </h1>
                                    <p className="text-2xl font-bold text-yellow-300">HIP-HOP EDITION</p>
                                    <p className="text-gray-400 mt-4 text-lg">Объясняй движения • Угадывай слова • Танцуй без перерывов</p>
                                </div>

                                <div className="space-y-4">
                                    <button onClick={() => setShowTeamSetup(true)} className="w-full py-4 bg-gradient-to-r from-yellow-400 to-red-500 text-black font-bold text-xl rounded-lg hover:shadow-lg hover:shadow-yellow-400/50 transition-all">
                                        👥 КОМАНДНАЯ ИГРА (4 РАУНДА)
                                    </button>
                                    <button onClick={() => {
                                        setGameMode('solo');
                                        setCurrentScreen('playing');
                                        setRoundScore(0);
                                        setUsedWords(new Set());
                                        const word = getRandomWord();
                                        setCurrentWord(word);
                                        setUsedWords(prev => new Set(prev).add(word));
                                        setTimeLeft(30);
                                    }} className="w-full py-4 bg-gradient-to-r from-red-600 to-pink-600 text-white font-bold text-xl rounded-lg hover:shadow-lg hover:shadow-red-500/50 transition-all">
                                        💪 ТРЕНИРОВКА СОЛО
                                    </button>
                                    <button onClick={() => setCurrentScreen('knowledge')} className="w-full py-4 bg-gradient-to-r from-blue-500 to-cyan-600 text-white font-bold text-xl rounded-lg hover:shadow-lg hover:shadow-blue-500/50 transition-all">
                                        📚 БАЗА ЗНАНИЙ
                                    </button>
                                </div>

                                <div className="text-gray-400 text-sm space-y-2 bg-gray-800/50 p-4 rounded-lg">
                                    <p><strong>Правила:</strong></p>
                                    <p>1️⃣ Один игрок объясняет слово/движение</p>
                                    <p>2️⃣ Остальные угадывают за 30 секунд</p>
                                    <p>3️⃣ Нельзя произносить само слово</p>
                                    <p>4️⃣ 4 раунда • Суммирование очков • Победитель в конце! 🏆</p>
                                </div>
                            </div>
                        )}

                        {showTeamSetup && (
                            <div className="text-center space-y-6 max-w-md w-full">
                                <h2 className="text-4xl font-black text-yellow-300">⚔️ СОЗДАЙ КОМАНДЫ</h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-yellow-300 font-bold mb-2">Команда 1 (жёлтая)</label>
                                        <input type="text" placeholder="Название команды..." value={team1Name} onChange={(e) => setTeam1Name(e.target.value)} className="w-full px-4 py-3 bg-gray-800 border-2 border-yellow-400 rounded-lg text-white" />
                                    </div>
                                    <div>
                                        <label className="block text-red-300 font-bold mb-2">Команда 2 (красная)</label>
                                        <input type="text" placeholder="Название команды..." value={team2Name} onChange={(e) => setTeam2Name(e.target.value)} className="w-full px-4 py-3 bg-gray-800 border-2 border-red-500 rounded-lg text-white" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={startTeamsGame} className="flex-1 py-4 bg-gradient-to-r from-yellow-400 to-red-500 text-black font-bold text-lg rounded-lg">🚀 НАЧАТЬ!</button>
                                    <button onClick={() => { setShowTeamSetup(false); setTeam1Name(''); setTeam2Name(''); }} className="flex-1 py-4 bg-gray-700 text-white font-bold text-lg rounded-lg">❌ ОТМЕНА</button>
                                </div>
                            </div>
                        )}

                        {currentScreen === 'playing' && gameMode !== 'solo' && (
                            <div className="w-full max-w-4xl space-y-6">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className={`p-4 rounded-lg border-2 ${currentTeam === 1 ? 'border-yellow-400 bg-yellow-500/10' : 'border-gray-600'}`}>
                                        <p className="text-yellow-300 font-bold text-sm">Раунд {currentTeam === 1 ? '🔴 АКТИВНА' : ''}</p>
                                        <p className="text-2xl font-black text-yellow-300">{team1Name}</p>
                                        <p className="text-3xl font-black text-yellow-400">{team1Score}</p>
                                    </div>
                                    <div className={`p-4 rounded-lg border-2 ${currentTeam === 2 ? 'border-red-500 bg-red-500/10' : 'border-gray-600'}`}>
                                        <p className="text-red-300 font-bold text-sm">Раунд {currentTeam === 2 ? '🔴 АКТИВНА' : ''}</p>
                                        <p className="text-2xl font-black text-red-300">{team2Name}</p>
                                        <p className="text-3xl font-black text-red-500">{team2Score}</p>
                                    </div>
                                </div>

                                <div className="text-center space-y-4">
                                    <div className="text-gray-300 font-bold text-lg">РАУНД {currentRound} / 4</div>
                                    <div className={`inline-flex items-center justify-center w-32 h-32 rounded-full font-black text-5xl ${timeLeft > 20 ? 'bg-gradient-to-br from-yellow-400 to-yellow-600 text-black' : 'bg-gradient-to-br from-red-500 to-red-700 text-white animate-pulse'}`}>
                                        {timeLeft}
                                    </div>
                                </div>

                                <div className="bg-gradient-to-br from-gray-800 to-gray-900 border-2 border-yellow-400 rounded-2xl p-12 text-center space-y-6">
                                    <p className="text-yellow-300 font-bold text-xl">ОБЪЯСНИ ДВИЖЕНИЕ:</p>
                                    {!showWord ? (
                                        <button onClick={() => setShowWord(true)} className="px-8 py-4 bg-gradient-to-r from-pink-500 to-red-600 rounded-lg font-bold text-xl">
                                            👁️ ПОКАЗАТЬ СЛОВО
                                        </button>
                                    ) : (
                                        <h2 className="text-6xl font-black bg-gradient-to-r from-yellow-300 to-red-500 bg-clip-text text-transparent">{currentWord}</h2>
                                    )}
                                    <div className="flex gap-3 justify-center flex-wrap pt-4 border-t border-gray-700">
                                        <span className="px-3 py-1 bg-green-500/20 text-green-300 rounded-full text-sm font-bold">✅ {roundScore} в этом раунде</span>
                                    </div>
                                </div>

                                <div className="flex gap-4 justify-center flex-wrap">
                                    <button onClick={guessedCorrect} className="px-8 py-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold text-lg rounded-lg">✅ УГАДАЛИ!</button>
                                    <button onClick={skipWord} className="px-8 py-4 bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold text-lg rounded-lg">⏭️ ПРОПУСТИТЬ</button>
                                    <button onClick={() => finishRound()} className="px-8 py-4 bg-gradient-to-r from-blue-500 to-cyan-600 text-white font-bold text-lg rounded-lg">⏹️ КОНЕЦ РАУНДА</button>
                                </div>
                            </div>
                        )}

                        {currentScreen === 'final' && (
                            <div className="text-center space-y-8 max-w-3xl">
                                <div className="space-y-4">
                                    <h2 className="text-5xl font-black text-yellow-300">ИГРА ОКОНЧЕНА!</h2>
                                </div>
                                <div className="bg-gradient-to-br from-gray-800 to-gray-900 border-2 border-yellow-400 rounded-2xl p-12 space-y-8">
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="bg-yellow-500/20 p-6 rounded-lg border border-yellow-500/50">
                                            <p className="text-yellow-300 text-sm font-bold mb-2">КОМАНДА 1</p>
                                            <p className="text-3xl font-black text-yellow-400">{team1Name}</p>
                                            <p className="text-5xl font-black text-yellow-300 mt-3">{team1Score}</p>
                                        </div>
                                        <div className="bg-red-500/20 p-6 rounded-lg border border-red-500/50">
                                            <p className="text-red-300 text-sm font-bold mb-2">КОМАНДА 2</p>
                                            <p className="text-3xl font-black text-red-400">{team2Name}</p>
                                            <p className="text-5xl font-black text-red-300 mt-3">{team2Score}</p>
                                        </div>
                                    </div>
                                    <div className="border-t border-gray-700 pt-8">
                                        <p className="text-gray-400 mb-3 text-lg">🏆 ПОБЕДИТЕЛЬ 🏆</p>
                                        {team1Score > team2Score ? (
                                            <div>
                                                <p className="text-4xl font-black bg-gradient-to-r from-yellow-300 to-orange-500 bg-clip-text text-transparent">{team1Name}</p>
                                                <p className="text-yellow-300 font-bold mt-2">+{team1Score - team2Score} точек</p>
                                            </div>
                                        ) : team2Score > team1Score ? (
                                            <div>
                                                <p className="text-4xl font-black bg-gradient-to-r from-red-300 to-pink-500 bg-clip-text text-transparent">{team2Name}</p>
                                                <p className="text-red-300 font-bold mt-2">+{team2Score - team1Score} точек</p>
                                            </div>
                                        ) : (
                                            <p className="text-3xl font-black text-purple-300">НИЧЬЯ!</p>
                                        )}
                                    </div>
                                </div>
                                <div className="flex gap-4 flex-col">
                                    <button onClick={resetGame} className="px-8 py-4 bg-gradient-to-r from-yellow-400 to-red-500 text-black font-bold text-xl rounded-lg">🔄 НОВАЯ ИГРА</button>
                                    <button onClick={resetGame} className="px-8 py-4 bg-gray-700 text-white font-bold text-lg rounded-lg">🏠 В МЕНЮ</button>
                                </div>
                            </div>
                        )}

                        {currentScreen === 'knowledge' && (
                            <div className="w-full max-w-4xl space-y-6">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-4xl font-black bg-gradient-to-r from-blue-300 to-cyan-400 bg-clip-text text-transparent">📚 БАЗА ЗНАНИЙ</h2>
                                    <button onClick={() => setCurrentScreen('menu')} className="px-4 py-2 bg-gray-700 text-white font-bold rounded-lg">🏠 МЕНЮ</button>
                                </div>
                                <div className="relative">
                                    <input type="text" placeholder="Поиск движения..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-12 pr-4 py-3 bg-gray-800 border-2 border-blue-500 rounded-lg text-white" />
                                </div>
                                <div className="grid gap-4 max-h-96 overflow-y-auto pr-2">
                                    {filteredMovements.length > 0 ? (
                                        filteredMovements.map((movement, idx) => (
                                            <div key={idx} className="bg-gradient-to-r from-gray-800 to-gray-900 border-l-4 border-blue-500 rounded-lg p-4">
                                                <h3 className="text-lg font-bold text-blue-300 mb-2">{movement.name}</h3>
                                                <p className="text-gray-300 text-sm">{movement.desc}</p>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="text-center py-8 text-gray-400">
                                            <p>Ничего не найдено</p>
                                        </div>
                                    )}
                                </div>
                                <p className="text-center text-gray-500 text-sm">Найдено: {filteredMovements.length} из {movements.length} движений</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<HiphopAliasGame />);
    </script>
</body>
</html>
